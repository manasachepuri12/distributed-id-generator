services:

  backend-1:
    build:
      context: ./backend
    container_name: backend-1-prod
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 1

  frontend:
    build:
      context: ./frontend
    container_name: id-generator-frontend-prod

  nginx:
    image: nginx:latest
    container_name: id-generator-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-1