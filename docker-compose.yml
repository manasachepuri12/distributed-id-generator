services:

  backend-1:
    build:
      context: ./backend
    container_name: backend-1
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 1
    ports:
      - "8081:8080"

  backend-2:
    build:
      context: ./backend
    container_name: backend-2
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 2
    ports:
      - "8082:8080"

  backend-3:
    build:
      context: ./backend
    container_name: backend-3
    environment:
      DATACENTER_ID: 1
      MACHINE_ID: 3
    ports:
      - "8083:8080"

  nginx:
    image: nginx:latest
    container_name: id-generator-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3